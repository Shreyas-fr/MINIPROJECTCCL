version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: surgegate-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: surgegate
      MYSQL_USER: surgegate_admin
      MYSQL_PASSWORD: surgegate_secret
      MYSQL_ROOT_PASSWORD: surgegate_root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-psurgegate_root_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: surgegate-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=surgegate
      - DB_USER=surgegate_admin
      - DB_PASSWORD=surgegate_secret
      - DATABASE_URL=mysql+pymysql://surgegate_admin:surgegate_secret@mysql:3306/surgegate?charset=utf8mb4
      - APP_PORT=8000
      - ENVIRONMENT=dev
      - USE_AWS_MOCK=true
      - LOCAL_STORAGE_DIR=/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ticket_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: surgegate-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
  ticket_storage:
